<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1626">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ponte">
<title>Ponte</title>
<style>
  :root { --bg:#0f1626; --surface:#151f35; --raised:#1b2741; --raised2:#223050; --line:#27355a; --soft:#1f2b47; --text:#e6eaf3; --text2:#b8c1d6; --muted:#8692ae; --sale:#f2b33d; --saleInk:#2a1e05; --supply:#3cc8b4; --supplyInk:#042420; --gain:#67d897; --loss:#ff7b6b; --warn:#f2b33d; }
  @media (prefers-color-scheme: light) { :root { --bg:#eef1f7; --surface:#fff; --raised:#f5f7fb; --raised2:#eaeef6; --line:#d8dfeb; --soft:#e5eaf2; --text:#172036; --text2:#36425e; --muted:#5f6b86; --sale:#b97a06; --saleInk:#fff8e8; --supply:#0b8f7f; --supplyInk:#f0fffc; --gain:#148a4b; --loss:#cf4535; --warn:#b97a06; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 54px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--soft); }
  header .logo { width: 34px; height: 24px; flex: none; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .back { width: 40px; height: 40px; margin-left: -8px; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; border-radius: 10px; flex: none; }
  header .back svg { width: 24px; height: 24px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
  .dot.on { background: var(--gain); }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex: none; }
  main { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--soft); border-radius: 16px; padding: 14px; }
  .card.tap { cursor: pointer; }
  .card.tap:active { background: var(--raised); }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--raised2); flex: none; }
  .thumb.sm { width: 38px; height: 38px; border-radius: 8px; }
  .t { font-weight: 600; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .xs { font-size: 12px; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  .gain { color: var(--gain); } .loss { color: var(--loss); } .warn { color: var(--warn); }
  .q { margin: 10px 0; padding: 10px 12px; background: var(--raised); border-radius: 12px; }
  textarea, input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  select { appearance: none; -webkit-appearance: none; }
  textarea { min-height: 96px; resize: vertical; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font: 600 15px system-ui, sans-serif; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn.sm { min-height: 36px; font-size: 13px; padding: 0 11px; border-radius: 10px; }
  .btn.main { background: var(--sale); color: var(--saleInk); border-color: transparent; }
  .btn.sup { background: var(--supply); color: var(--supplyInk); border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--loss); }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .55; }
  .btn svg { width: 17px; height: 17px; }
  .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .acts .btn { flex: 1; }
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--raised2); color: var(--text2); white-space: nowrap; }
  .chip.sale { background: color-mix(in srgb, var(--sale) 18%, transparent); color: var(--sale); }
  .chip.sup { background: color-mix(in srgb, var(--supply) 18%, transparent); color: var(--supply); }
  .chip.gain { background: color-mix(in srgb, var(--gain) 16%, transparent); color: var(--gain); }
  .chip.loss { background: color-mix(in srgb, var(--loss) 16%, transparent); color: var(--loss); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--soft); padding-bottom: env(safe-area-inset-bottom); }
  nav button { height: 60px; border: 0; background: transparent; color: var(--muted); font: 600 11px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
  nav button.on { color: var(--sale); }
  nav button svg { width: 22px; height: 22px; }
  nav .badge { position: absolute; top: 6px; left: calc(50% + 5px); min-width: 18px; height: 18px; border-radius: 99px; background: var(--loss); color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
  .seg { display: flex; gap: 4px; background: var(--raised); border-radius: 12px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: 1 0 auto; height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--text2); font: 600 13px system-ui, sans-serif; padding: 0 10px; white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .empty { text-align: center; padding: 36px 10px; color: var(--muted); }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); background: var(--raised2); color: var(--text); padding: 12px 14px; border-radius: 12px; z-index: 9; box-shadow: 0 8px 30px rgba(0,0,0,.35); max-width: 728px; margin: 0 auto; }
  .toast.err { border-left: 4px solid var(--loss); }
  .addr { font-size: 14px; color: var(--text2); background: var(--raised); border-radius: 10px; padding: 10px 12px; margin-top: 8px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .login { max-width: 420px; margin: 40px auto; padding: 0 16px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--soft); border-radius: 16px; padding: 12px 14px; cursor: pointer; }
  .tile .k { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tile .s { font-size: 12px; color: var(--muted); }
  .tile.alert .v { color: var(--loss); }
  .tile.hot .v { color: var(--sale); }
  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 2px 0; }
  .search { position: relative; }
  .search input { padding-left: 38px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--soft); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .kv b { font-weight: 600; }
  .sup-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--soft); }
  .sup-row:last-child { border-bottom: 0; }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .steps button { min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--text2); font: 600 12px system-ui, sans-serif; padding: 0 2px; }
  .steps button.on { background: var(--sale); color: var(--saleInk); border-color: transparent; }
  .bubbles { display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 84%; padding: 9px 12px; border-radius: 14px; background: var(--raised); white-space: pre-wrap; word-wrap: break-word; }
  .bubble.me { align-self: flex-end; background: color-mix(in srgb, var(--supply) 22%, var(--surface)); }
  .bubble .when { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper input { width: 84px; text-align: center; padding: 9px 6px; }
  .stepper .btn { min-width: 44px; padding: 0; }
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--soft); }
  .sw:last-child { border-bottom: 0; }
  .sw input { width: 46px; height: 26px; appearance: none; -webkit-appearance: none; background: var(--raised2); border-radius: 99px; position: relative; border: 0; padding: 0; flex: none; }
  .sw input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked { background: var(--supply); }
  .sw input:checked::after { transform: translateX(20px); }
  .spin { width: 22px; height: 22px; border: 3px solid var(--raised2); border-top-color: var(--sale); border-radius: 50%; animation: sp .8s linear infinite; margin: 20px auto; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .banner { background: color-mix(in srgb, var(--sale) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--sale) 40%, transparent); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
  .banner.err { background: color-mix(in srgb, var(--loss) 12%, var(--surface)); border-color: color-mix(in srgb, var(--loss) 40%, transparent); }
  .group-h { display: flex; align-items: center; gap: 8px; }
  a { color: var(--supply); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var KEY = 'ponte-mobile';
  var st = load();
  var ui = { snap: null, me: null, worker: null, moved: null, busy: {}, drafts: {}, lastErr: null, vkey: null, vtried: 0, msgs: {}, filters: { vendas: 'novo', q: '', anuncios: 'todos', aq: '', at: 'perguntas', es: 'anuncios' }, pending: false, loaded: false };
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* sem armazenamento */ } }
  function saveSnap() { try { localStorage.setItem(KEY + '-snap', JSON.stringify({ key: ui.vkey, version: ui.snapVer, team: st.team, url: st.url, snap: ui.snap })); } catch (e) { /* cheio */ } }
  (function () { try { var c = JSON.parse(localStorage.getItem(KEY + '-snap')); if (c && c.team === st.team && c.url === st.url) { ui.snap = c.snap; ui.vkey = c.key; ui.snapVer = c.version; } } catch (e) { /* sem cópia */ } })();
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(v) { if (v === null || v === undefined || v === '') return 0; if (typeof v === 'number') return v; var s = String(v).trim().replace(/\s|R\$|US\$/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var n = parseFloat(s); return isFinite(n) ? n : 0; }
  function brl(v) { return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function money(v, cur) { if (v === '' || v == null) return ''; var n = num(v); if (!cur || cur === 'BRL') return brl(n); return (cur === 'USD' ? 'US$ ' : cur === 'CNY' ? '¥ ' : cur + ' ') + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function pct(v) { return ((Number(v) || 0) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%'; }
  function ago(iso) { if (!iso) return ''; var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); if (m < 1) return 'agora'; if (m < 60) return 'há ' + m + ' min'; var h = Math.round(m / 60); if (h < 24) return 'há ' + h + ' h'; var d = Math.round(h / 24); return 'há ' + d + (d === 1 ? ' dia' : ' dias'); }
  function when(iso) { if (!iso) return ''; var d = new Date(iso); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }
  function toast(msg, err) { $$('.toast').forEach(function (t) { t.remove(); }); var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 6000 : 3500); }
  function copy(text, what) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast((what || 'Texto') + ' copiado.'); }, function () { prompt('Copie:', text); }); }
  var I = {
    logo: '<svg class="logo" viewBox="0 0 120 80"><path d="M22 58 C 34 6, 86 6, 98 58" fill="none" stroke="#f2b33d" stroke-width="9" stroke-linecap="round"/><circle cx="22" cy="58" r="11" fill="none" stroke="#f2b33d" stroke-width="9"/><circle cx="98" cy="58" r="11" fill="none" stroke="#3cc8b4" stroke-width="9"/></svg>',
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
    back: '<path d="m15 18-6-6 6-6"/>',
    ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    spark: '<path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0L14.06 8.5A2 2 0 0 0 15.5 9.94l6.14 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  };
  function ic(name, cls) { return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + I[name] + '</svg>'; }

  // ligação vinda do QR code: #c=<base64>
  (function () {
    var m = location.hash.match(/c=([A-Za-z0-9_-]+)/);
    if (!m) return;
    try {
      var b = m[1].replace(/-/g, '+').replace(/_/g, '/');
      var j = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
      if (j.u && j.k && j.t) {
        if (st.team !== j.t || st.url !== j.u) { st.access = null; ui.snap = null; }
        st.url = j.u; st.key = j.k; st.team = j.t; st.teamName = j.n || ''; save();
      }
    } catch (e) { /* link inválido */ }
    history.replaceState(null, '', location.pathname + '#inicio');
  })();

  /* ------------------------------------------------------------ servidor da equipe */
  function apiAt(base, path, body, access) {
    var h = { apikey: base.key, 'content-type': 'application/json' };
    if (access) h.Authorization = 'Bearer ' + access;
    return fetch(base.url + path, { method: 'POST', headers: h, body: JSON.stringify(body || {}) }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
    }, function () { return { ok: false, status: 0, body: { message: 'Sem conexão com o servidor da equipe.' } }; });
  }
  function api(path, body, auth) { return apiAt({ url: st.url, key: st.key }, path, body, auth !== false ? st.access : null); }
  function mySub() { try { var p = String(st.access || '').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(atob(p + '==='.slice((p.length + 3) % 4))).sub || null; } catch (e) { return null; } }
  function errText(j) { var m = (j && (j.message || j.msg || j.error_description || j.error)) || 'Erro'; if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.'; return m; }
  var refreshing = null;
  function refresh() {
    if (refreshing) return refreshing;
    refreshing = api('/auth/v1/token?grant_type=refresh_token', { refresh_token: st.refresh }, false).then(function (r) {
      if (!r.ok) { if (r.status) { st.access = null; save(); render(); } throw new Error(r.status ? 'Entre de novo.' : 'Sem conexão.'); }
      st.access = r.body.access_token; st.refresh = r.body.refresh_token; st.exp = Date.now() + (r.body.expires_in || 3600) * 1000; save();
    }).then(function (x) { refreshing = null; return x; }, function (e) { refreshing = null; throw e; });
    return refreshing;
  }
  function rpc(fn, args) {
    var go = function () { return api('/rest/v1/rpc/' + fn, args); };
    var pre = st.exp && Date.now() > st.exp - 60000 ? refresh() : Promise.resolve();
    return pre.then(go).then(function (r) { if (r.status === 401) return refresh().then(go); return r; }).then(function (r) {
      if (!r.ok) throw new Error(errText(r.body));
      return r.body;
    });
  }
  // lê um documento; "p_since" só existe no banco versão 5: no banco antigo, pede sem ele
  function getDoc(kind, key, since) {
    var args = { p_team: st.team, p_kind: kind, p_key: key };
    var withSince = typeof since === 'number' && !ui.noSince;
    if (withSince) args.p_since = since;
    return rpc('ponte_get', args).catch(function (e) {
      if (withSince && /does not exist|could not find the function|p_since/i.test(e.message)) {
        ui.noSince = true; ui.oldDb = true;
        delete args.p_since;
        return rpc('ponte_get', args);
      }
      throw e;
    });
  }
  function login(email, pass) {
    return api('/auth/v1/token?grant_type=password', { email: email, password: pass }, false).then(function (r) {
      if (!r.ok) throw new Error(errText(r.body));
      st.access = r.body.access_token; st.refresh = r.body.refresh_token; st.exp = Date.now() + (r.body.expires_in || 3600) * 1000; st.email = email; save();
    });
  }

  /* ------------------------------------------------------------ dados (versão de acordo com a permissão) */
  function variantsFor(me) {
    if (!me) return ['owner', 'costs', 'team'];
    if (me.role === 'owner') return ['owner', 'costs', 'team'];
    if ((me.perms || {}).custos) return ['costs', 'team'];
    return ['team'];
  }
  function normalizeSnap(s) {
    if (!s || s.v === 2) return s;
    // dados de um computador com o Ponte antigo
    return { v: 1, old: true, accounts: [], costs: false, questions: s.questions || [], messages: [], claims: [], items: [], stock: null, templates: [], summary: null, lowStock: 3,
      orders: (s.orders || []).map(function (o) { return { id: o.id, date: o.date, status: o.status, acc: o.acc, buyer: { nickname: o.buyer || '' }, total: o.total, addr: o.addr ? { name: o.addr.name, street: o.addr.line, number: '', neighborhood: '', city: o.addr.city, state: '', zip: o.addr.zip } : null, items: (o.items || []).map(function (i) { return { id: i.id, title: i.title, qty: i.qty, variation: i.variation, thumb: i.thumb, links: o.link ? [o.link] : [] }; }), meta: o.meta || { status: 'novo' } }; }), at: s.at };
  }
  var pollT = null, polling = false;
  function poll(soon) {
    clearTimeout(pollT);
    if (!st.access || !st.team) return;
    if (soon) { pollT = setTimeout(poll, soon); return; }
    if (polling) return;
    polling = true;

    if (sup === 'ios-install') html += '<div class="banner" style="margin-top:10px">No iPhone, as notificações só funcionam com o Ponte instalado: toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>. Abra o Ponte pelo ícone novo e volte aqui.</div>';
    else if (sup === 'no') html += '<p class="small muted">Este navegador não aceita notificações. Use o Chrome no Android ou o Safari no iPhone (iOS 16.4 ou mais novo).</p>';
    else if (!st.pushOn || Notification.permission !== 'granted') html += '<div class="acts"><button class="btn main" data-push="on"' + (ui.busy.push ? ' disabled' : '') + '>' + ic('bell') + (ui.busy.push ? ' Ativando…' : ' Ativar notificações') + '</button></div>';
    else html += [['sale', 'Vendas novas'], ['question', 'Perguntas'], ['message', 'Mensagens de compradores'], ['claim', 'Reclamações']].map(function (p) { return '<label class="sw"><span>' + p[1] + '</span><input type="checkbox" data-pref="' + p[0] + '"' + (prefs[p[0]] !== false ? ' checked' : '') + '></label>'; }).join('') +
      '<div class="acts"><button class="btn ghost danger" data-push="off">Desligar notificações</button></div>';
    html += '</div>';
    // instalar
    var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (!standalone) html += '<div class="card"><div class="t">Instalar como app</div><p class="small muted" style="margin:6px 0 0">' + (/iphone|ipad|ipod/i.test(navigator.userAgent) ? 'No Safari: toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>.' : 'No Chrome: toque no menu (⋮) → <b>Instalar app</b> (ou “Adicionar à tela inicial”).') + ' O Ponte abre em tela cheia, com ícone próprio, como um app.</p></div>';
    var w = ui.worker;
    html += '<div class="card"><div class="kv"><span class="muted">Equipe</span><b>' + esc(st.teamName || '') + '</b></div><div class="kv"><span class="muted">Computador principal</span><b>' + (w && online() ? esc(w.name || '') + (w.app ? ' · ' + esc(w.app) : '') : 'desligado') + '</b></div><div class="kv"><span class="muted">Dados de</span><b>' + (ui.snap && ui.snap.at ? when(ui.snap.at) : '—') + '</b></div>' +
      '<div class="acts"><button class="btn" data-refresh="1"' + (ui.busy.refresh ? ' disabled' : '') + '>' + (ui.busy.refresh ? 'Atualizando…' : 'Buscar novidades agora') + '</button></div></div>';
    html += '<button class="btn block ghost danger" id="out">Sair</button>';
    return html;
  }

  /* ------------------------------------------------------------ desenho */
  function render() {
    var app = $('#app');
    if (!st.url || !st.key || !st.team) {
      app.innerHTML = '<div class="login"><div style="width:72px">' + I.logo.replace('class="logo"', 'style="width:72px;height:50px"') + '</div><h1>Ponte no celular</h1><p class="muted">Abra o Ponte no computador, vá em <b>Equipe → Ponte no celular</b> e aponte a câmera para o código.</p></div>';
      return;
    }
    if (!st.access) {
      app.innerHTML = '<div class="login"><div style="width:72px">' + I.logo.replace('class="logo"', 'style="width:72px;height:50px"') + '</div><h1>' + esc(st.teamName || 'Ponte') + '</h1><p class="muted">Entre com o e-mail e a senha que você usa na equipe do Ponte.</p>' +
        '<label>E-mail</label><input id="em" type="email" autocomplete="username" value="' + esc(st.email || '') + '">' +
        '<label>Senha</label><input id="pw" type="password" autocomplete="current-password">' +
        '<p id="lerr" class="small" style="color:var(--loss)"></p><button class="btn main block" id="go">Entrar</button></div>';
      $('#go').onclick = function () {
        this.disabled = true;
        var b = this;
        login($('#em').value.trim(), $('#pw').value).then(function () { ui.me = null; poll(); render(); }).catch(function (e) { $('#lerr').textContent = e.message; b.disabled = false; });
      };
      return;
    }
    var r = route();
    var tab = TAB_OF[r.name] || 'inicio';
    var titles = { inicio: st.teamName || 'Ponte', vendas: 'Vendas', venda: 'Venda', perguntas: 'Atendimento', mensagens: 'Atendimento', reclamacoes: 'Atendimento', msg: 'Conversa', anuncios: 'Estoque', anuncio: 'Anúncio', estoque: 'Estoque', mais: 'Mais' };
    var back = r.name === 'venda' ? 'vendas' : r.name === 'msg' ? 'mensagens' : r.name === 'anuncio' ? 'anuncios' : null;
    var body = noticeHTML();
    if (ui.snap && !ui.moved) {
      if (r.name === 'inicio') body += pageInicio();
      else if (r.name === 'vendas') body += pageVendas();
      else if (r.name === 'venda') body += pageVenda(r.id);
      else if (r.name === 'perguntas' || r.name === 'mensagens' || r.name === 'reclamacoes') body += pageAtend(r.name);
      else if (r.name === 'msg') body += pageMsg(r.id);
      else if (r.name === 'anuncios' || r.name === 'estoque') body += pageEstoque(r.name);
      else if (r.name === 'anuncio') body += pageAnuncio(r.id);
    }
    if (r.name === 'mais') body += pageMais();
    var s = S();
    var badge = function (n) { return n ? '<span class="badge">' + (n > 99 ? '99+' : n) + '</span>' : ''; };
    var nav = '<nav>' + [['inicio', 'Início', 'home', 0], ['vendas', 'Vendas', 'bag', toBuy().length], ['atend', 'Atendimento', 'chat', s.questions.length + s.messages.length], ['estoque', 'Estoque', 'box', 0], ['mais', 'Mais', 'more', 0]].map(function (x) {
      var target = x[0] === 'atend' ? (s.questions.length || !s.messages.length ? 'perguntas' : 'mensagens') : x[0] === 'estoque' ? 'anuncios' : x[0];
      return '<button class="' + (tab === x[0] ? 'on' : '') + '" data-go="' + target + '">' + ic(x[2]) + x[1] + badge(x[3]) + '</button>';
    }).join('') + '</nav>';
    // guarda o que estava escrito
    var keep = {};
    $$('textarea[id],input[id]').forEach(function (t) { if (t.id !== 'vq' && t.id !== 'aq') keep[t.id] = t.value; });
    var y = window.scrollY;
    app.innerHTML = headerHTML(titles[r.name] || 'Ponte', back) + '<main>' + body + '</main>' + nav;
    Object.keys(keep).forEach(function (id) { var t = document.getElementById(id); if (t && !t.value) t.value = keep[id]; });
    window.scrollTo(0, y);
    var mvgo = $('#mvgo');
    if (mvgo) mvgo.onclick = function () {
      var b = this; b.disabled = true; b.textContent = 'Entrando…';
      followMove($('#mvp').value).then(function () { toast('Pronto: o celular já usa o servidor novo.'); poll(); render(); })
        .catch(function (e) { b.disabled = false; b.textContent = 'Continuar'; var el = $('#mverr'); if (el) el.textContent = e.message; });
    };
    if (r.name === 'msg') setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 30);
  }

  // a equipe mudou de servidor: entra no novo (cria o cadastro se precisar) e usa o código desta pessoa
  function followMove(pass) {
    var mv = ui.moved, base = { url: mv.url.replace(/\/+$/, ''), key: mv.key };
    var sub = mySub();
    var tokP = sub ? getDoc('moved', sub).then(function (d) { return d && d.data ? d.data.token : null; }, function () { return null; }) : Promise.resolve(null);
    return tokP.then(function (tok) {
      return apiAt(base, '/auth/v1/token?grant_type=password', { email: st.email, password: pass }).then(function (r) {
        if (r.ok) return r;
        return apiAt(base, '/auth/v1/signup', { email: st.email, password: pass }).then(function (r2) {
          if (!r2.ok || !r2.body || !r2.body.access_token) throw new Error(/already/i.test(errText(r2.body)) ? 'Você já tem cadastro no servidor novo, mas a senha não confere.' : errText(r2.body));
          return r2;
        });
      }).then(function (r) {
        var b = r.body;
        var claim = tok ? apiAt(base, '/rest/v1/rpc/ponte_team_claim', { p_team: st.team, p_token: tok, p_name: (ui.me && ui.me.name) || null, p_email: st.email }, b.access_token).then(function (c) { if (!c.ok) throw new Error(errText(c.body)); }) : Promise.resolve();
        return claim.then(function () {
          st.url = base.url; st.key = base.key; st.access = b.access_token; st.refresh = b.refresh_token; st.exp = Date.now() + (b.expires_in || 3600) * 1000; st.pushAt = 0; save();
          ui.moved = null; ui.snap = null; ui.vkey = null; pushChecked = false;
        });
      });
    });
  }

  /* ------------------------------------------------------------ toques */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id && t.id.indexOf('a-') === 0) ui.drafts[t.id.slice(2)] = t.value;
    if (t.id && t.id.indexOf('m-') === 0) ui.drafts['m' + t.id.slice(2)] = t.value;
    if (t.id === 'vq') { ui.filters.q = t.value; clearTimeout(ui.qT); ui.qT = setTimeout(function () { var pos = t.selectionStart; render(); var n = $('#vq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* ok */ } } }, 250); }
    if (t.id === 'aq') { ui.filters.aq = t.value; clearTimeout(ui.qT); ui.qT = setTimeout(function () { var pos = t.selectionStart; render(); var n = $('#aq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* ok */ } } }, 250); }
    if (t.dataset.meta) { var k = 'meta' + t.dataset.id; ui.drafts[k] = ui.drafts[k] || {}; ui.drafts[k][t.dataset.meta] = t.value; }
    if (t.dataset.itf) { var k2 = 'it' + t.dataset.id; ui.drafts[k2] = ui.drafts[k2] || {}; ui.drafts[k2][t.dataset.itf] = t.value; }
    if (t.dataset.gval) { ui.drafts['g' + t.dataset.gval] = t.value; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.tpl) { var tp = (S().templates || []).filter(function (x) { return x.id === t.value; })[0]; if (tp) { var ta = $('#a-' + CSS.escape(t.dataset.tpl)); ta.value = tp.text; ui.drafts[t.dataset.tpl] = tp.text; } t.value = ''; }
    if (t.dataset.mtpl) { var tm = (S().templates || []).filter(function (x) { return x.id === t.value; })[0]; var o = S().orders.filter(function (x) { return x.id === t.dataset.mtpl; })[0]; if (tm) { var tb = $('#m-' + CSS.escape(t.dataset.mtpl)); tb.value = fillTpl(tm.text, o); ui.drafts['m' + t.dataset.mtpl] = tb.value; } t.value = ''; }
    if (t.dataset.gval) render();
    if (t.dataset.pref) {
      st.pushPrefs = st.pushPrefs || {}; st.pushPrefs[t.dataset.pref] = t.checked; st.pushAt = 0; save();
      navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) { if (sub) return putSub(sub); }).then(function () { toast('Preferências salvas.'); }, function (er) { toast(er.message, true); });
    }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-vf],[data-af],[data-ans],[data-ai],[data-copy],[data-status],[data-savemeta],[data-send],[data-reloadmsg],[data-saveit],[data-itstatus],[data-gstep],[data-gsave],[data-greset],[data-push],[data-refresh],#out');
    if (!t || t.disabled) return;
    if (t.tagName === 'A') return;
    if (t.dataset.vf && t.dataset.go) { ui.filters.vendas = t.dataset.vf; }
    if (t.dataset.af && t.dataset.go) { ui.filters.anuncios = t.dataset.af; }
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.dataset.vf) { ui.filters.vendas = t.dataset.vf; render(); return; }
    if (t.dataset.af) { ui.filters.anuncios = t.dataset.af; render(); return; }
    if (t.id === 'out') { if (st.pushOn) disablePush().catch(function () { return null; }); st.access = null; st.refresh = null; ui.snap = null; ui.me = null; save(); try { localStorage.removeItem(KEY + '-snap'); } catch (x) { /* ok */ } render(); return; }
    if (t.dataset.copy) { copy(t.dataset.copy, t.dataset.what); return; }
    if (t.dataset.ans) {
      var id = t.dataset.ans;
      var text = ($('#a-' + CSS.escape(id)) || {}).value || '';
      if (!text.trim()) { toast('Escreva a resposta.', true); return; }
      busy(id, function () { return command({ type: 'answer', qid: id, text: text.trim() }).then(function () { delete ui.drafts[id]; if (ui.snap) ui.snap.questions = ui.snap.questions.filter(function (q) { return q.id !== id; }); }); }, 'Resposta publicada no Mercado Livre.');
      return;
    }
    if (t.dataset.ai) {
      var qid = t.dataset.ai;
      busy('ai' + qid, function () { return command({ type: 'ai', qid: qid }).then(function (r) { ui.drafts[qid] = r.text || ''; var ta = $('#a-' + CSS.escape(qid)); if (ta) ta.value = r.text || ''; }); }, 'Sugestão pronta: confira antes de responder.');
      return;
    }
    if (t.dataset.status) {
      var oid = t.dataset.id, next = t.dataset.status;
      var o = S().orders.filter(function (x) { return x.id === oid; })[0];
      if (o && o.meta.status === next) return;
      var md = ui.drafts['meta' + oid] || {};
      busy('st' + oid, function () { return command({ type: 'status', orderId: oid, orderStatus: next, supplierOrderId: md.supplierOrderId || undefined }).then(function () { if (o) { o.meta.status = next; o.meta.statusBy = (ui.me && ui.me.name) || ''; o.meta.statusAt = new Date().toISOString(); } }); }, 'Venda marcada como ' + STATUS[next].toLowerCase() + '.');
      return;
    }
    if (t.dataset.savemeta) {
      var mid = t.dataset.savemeta;
      var patch = ui.drafts['meta' + mid] || {};
      if (!Object.keys(patch).length) { toast('Nada mudou.'); return; }
      busy('mt' + mid, function () { return command({ type: 'meta', orderId: mid, patch: patch }).then(function () { var o2 = S().orders.filter(function (x) { return x.id === mid; })[0]; if (o2) Object.keys(patch).forEach(function (k) { o2.meta[k] = patch[k]; }); delete ui.drafts['meta' + mid]; }); }, 'Dados da venda salvos.');
      return;
    }
    if (t.dataset.reloadmsg) { delete ui.msgs[t.dataset.reloadmsg]; render(); return; }
    if (t.dataset.send) {
      var so = t.dataset.send;
      var txt = ($('#m-' + CSS.escape(so)) || {}).value || '';
      if (!txt.trim()) { toast('Escreva a mensagem.', true); return; }
      busy('ms' + so, function () { return command({ type: 'message', orderId: so, text: txt.trim() }).then(function () { delete ui.drafts['m' + so]; var conv = ui.msgs[so]; if (conv && conv.messages) conv.messages.push({ fromSeller: true, text: txt.trim(), date: new Date().toISOString() }); var ta = $('#m-' + CSS.escape(so)); if (ta) ta.value = ''; }); }, 'Mensagem enviada.');
      return;
    }
    if (t.dataset.saveit) {
      var iid = t.dataset.saveit;
      var it = S().items.filter(function (x) { return x.id === iid; })[0];
      var dd = ui.drafts['it' + iid] || {};
      var cmd = { type: 'item_edit', itemId: iid };
      if (dd.price !== undefined) { var pz = num(dd.price); if (!(pz > 0)) { toast('Preço inválido.', true); return; } if (Math.abs(pz - it.price) > 0.001) cmd.price = pz; }
      if (it.variations.length) { var vs = it.variations.filter(function (v) { return dd['v' + v.id] !== undefined && Math.round(num(dd['v' + v.id])) !== (v.available || 0); }); if (vs.length) cmd.variations = it.variations.map(function (v) { return { id: v.id, available: dd['v' + v.id] !== undefined ? Math.round(num(dd['v' + v.id])) : v.available }; }); }
      else if (dd.available !== undefined && Math.round(num(dd.available)) !== (it.available || 0)) cmd.available = Math.round(num(dd.available));
      if (cmd.price === undefined && !cmd.variations && cmd.available === undefined) { toast('Nada mudou.'); return; }
      busy('it' + iid, function () { return command(cmd).then(function (r) { delete ui.drafts['it' + iid]; if (cmd.price) it.price = cmd.price; if (cmd.available !== undefined) it.available = cmd.available; if (cmd.variations) cmd.variations.forEach(function (v) { var x = it.variations.filter(function (y) { return y.id === v.id; })[0]; if (x) x.available = v.available; }); return r; }); }, function (r) { return r && r.routed && r.routed.length ? 'Salvo: o estoque físico do grupo mudou e as outras contas foram atualizadas.' : 'Salvo no Mercado Livre.'; });
      return;
    }
    if (t.dataset.itstatus) {
      var sid = t.dataset.id, ns = t.dataset.itstatus;
      busy('is' + sid, function () { return command({ type: 'item_status', itemId: sid, itemStatus: ns }).then(function () { var x = S().items.filter(function (y) { return y.id === sid; })[0]; if (x) x.status = ns; }); }, ns === 'paused' ? 'Anúncio pausado.' : 'Anúncio reativado.');
      return;
    }
    if (t.dataset.gstep) {
      var gid = t.dataset.g;
      var g = (S().stock.groups || []).filter(function (x) { return x.id === gid; })[0];
      var cur = ui.drafts['g' + gid] !== undefined ? Number(ui.drafts['g' + gid]) : g.physical;
      ui.drafts['g' + gid] = Math.max(0, (Number(cur) || 0) + Number(t.dataset.gstep));
      render(); return;
    }
    if (t.dataset.greset) { delete ui.drafts['g' + t.dataset.greset]; render(); return; }
    if (t.dataset.gsave) {
      var gs = t.dataset.gsave;
      var val = Math.max(0, Math.round(Number(ui.drafts['g' + gs]) || 0));
      busy('g' + gs, function () { return command({ type: 'stock', groupId: gs, physical: val }).then(function () { var g2 = (S().stock.groups || []).filter(function (x) { return x.id === gs; })[0]; if (g2) g2.physical = val; delete ui.drafts['g' + gs]; }); }, 'Estoque físico salvo. Os anúncios do grupo foram atualizados.');
      return;
    }
    if (t.dataset.push) {
      if (t.dataset.push === 'on') busy('push', function () { return enablePush(); }, 'Notificações ativadas neste celular.');
      else disablePush().then(function () { toast('Notificações desligadas.'); render(); });
      return;
    }
    if (t.dataset.refresh) { busy('refresh', function () { return command({ type: 'refresh' }); }, 'Pronto: dados atualizados.'); return; }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* sem cache offline */ });
  render();
  poll();
})();
</script>
</body>
